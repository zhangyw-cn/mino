<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello · Mino Example</title>
  <style>
    :root { color-scheme: light; --ink: #1c1917; --muted: #78716c; --bg: #fafaf9; --accent: #0f766e; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: radial-gradient(circle at 20% 20%, #ccfbf1, transparent 45%),
                  radial-gradient(circle at 80% 0%, #fef3c7, transparent 40%),
                  var(--bg);
      color: var(--ink);
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    p { margin: 0; color: var(--muted); }
    button {
      margin-top: 1.25rem; border: 0; border-radius: .75rem; padding: .7rem 1.2rem;
      background: var(--accent); color: white; font: inherit; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main>
    <h1 id="greet">你好，Mino</h1>
    <p>独立单文件 HTML · 用于目录浏览与预览测试</p>
    <button type="button" id="btn">换一句问候</button>
  </main>
  <script>
    const lines = ["你好，Mino", "Hello from example/", "单文件也能当小应用", "点左侧树打开更多例子"];
    let i = 0;
    document.getElementById("btn").onclick = () => {
      i = (i + 1) % lines.length;
      document.getElementById("greet").textContent = lines[i];
    };
  </script>
</body>
</html>
