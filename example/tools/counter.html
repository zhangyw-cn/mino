<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Counter · Mino Example</title>
  <style>
    :root { --ink: #1e293b; --accent: #c2410c; --bg: #fff7ed; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--ink);
    }
    main { text-align: center; }
    .n { font-size: 4rem; font-variant-numeric: tabular-nums; margin: .25rem 0 1rem; }
    .row { display: flex; gap: .6rem; justify-content: center; }
    button {
      border: 0; border-radius: 999px; min-width: 3rem; padding: .7rem 1rem;
      font: inherit; cursor: pointer; background: #fed7aa; color: var(--ink);
    }
    button.primary { background: var(--accent); color: #fff; }
    small { display: block; margin-top: 1rem; color: #9a3412; }
  </style>
</head>
<body>
  <main>
    <h1>计数器</h1>
    <div class="n" id="n">0</div>
    <div class="row">
      <button type="button" id="dec">−</button>
      <button type="button" class="primary" id="inc">+</button>
      <button type="button" id="clear">清零</button>
    </div>
    <small>数值保存在 localStorage，刷新后仍在</small>
  </main>
  <script>
    const KEY = "mino-example-counter";
    const el = document.getElementById("n");
    let n = Number(localStorage.getItem(KEY) || 0);
    const render = () => { el.textContent = String(n); localStorage.setItem(KEY, String(n)); };
    document.getElementById("inc").onclick = () => { n += 1; render(); };
    document.getElementById("dec").onclick = () => { n -= 1; render(); };
    document.getElementById("clear").onclick = () => { n = 0; render(); };
    render();
  </script>
</body>
</html>
