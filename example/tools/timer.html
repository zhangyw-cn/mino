<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timer · Mino Example</title>
  <style>
    :root { color-scheme: light; --ink: #111827; --panel: #fff; --line: #e5e7eb; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "PingFang SC", sans-serif; background: #f3f4f6; color: var(--ink);
    }
    .card {
      width: min(22rem, 92vw); background: var(--panel); border: 1px solid var(--line);
      border-radius: 1rem; padding: 1.5rem; box-shadow: 0 10px 30px rgb(0 0 0 / 6%);
    }
    h1 { margin: 0 0 1rem; font-size: 1.1rem; font-weight: 600; }
    .time {
      font-variant-numeric: tabular-nums; font-size: 2.8rem; letter-spacing: .04em;
      text-align: center; margin: .5rem 0 1.25rem;
    }
    .row { display: flex; gap: .5rem; }
    button {
      flex: 1; border: 1px solid var(--line); background: #f9fafb; border-radius: .65rem;
      padding: .65rem; font: inherit; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>简易秒表</h1>
    <div class="time" id="display">00:00.0</div>
    <div class="row">
      <button type="button" class="primary" id="toggle">开始</button>
      <button type="button" id="reset">复位</button>
    </div>
  </div>
  <script>
    let t0 = 0, acc = 0, timer = null;
    const display = document.getElementById("display");
    const toggle = document.getElementById("toggle");
    function fmt(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const d = Math.floor((ms % 1000) / 100);
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + d;
    }
    function tick() { display.textContent = fmt(acc + (Date.now() - t0)); }
    toggle.onclick = () => {
      if (timer) {
        acc += Date.now() - t0;
        clearInterval(timer);
        timer = null;
        toggle.textContent = "继续";
      } else {
        t0 = Date.now();
        timer = setInterval(tick, 50);
        toggle.textContent = "暂停";
      }
    };
    document.getElementById("reset").onclick = () => {
      clearInterval(timer);
      timer = null;
      acc = 0;
      display.textContent = "00:00.0";
      toggle.textContent = "开始";
    };
  </script>
</body>
</html>
