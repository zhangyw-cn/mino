<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self';">
  <title>Markdown preview</title>
  <link rel="stylesheet" href="/md/viewer.css">
  <link rel="stylesheet" href="/md/vendor/highlight.min.css">
  <link rel="stylesheet" href="/md/vendor/katex.min.css">
</head>
<body>
  <div class="md-layout">
    <main id="content" class="markdown-body" data-path="{{.Path}}"></main>
    <aside id="toc" class="toc" hidden>
      <div class="toc-header">
        <span class="toc-title">On this page</span>
        <button type="button" id="toc-toggle" class="toc-toggle" aria-expanded="true" aria-controls="toc-nav">Hide</button>
      </div>
      <nav id="toc-nav" class="toc-nav" aria-label="On this page"></nav>
    </aside>
  </div>
  <p id="error" class="error" hidden></p>
  <script src="/md/vendor/marked.min.js"></script>
  <script src="/md/vendor/purify.min.js"></script>
  <script src="/md/vendor/highlight.min.js"></script>
  <script src="/md/vendor/katex.min.js"></script>
  <script src="/md/vendor/mermaid.min.js"></script>
  <script src="/md/preprocess.js"></script>
  <script src="/md/toc.js"></script>
  <script src="/md/mermaid-block.js"></script>
  <script src="/md/preview-width.js"></script>
  <script src="/preview-session.js"></script>
  <script src="/md/viewer.js"></script>
</body>
</html>
