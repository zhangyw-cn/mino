<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mino</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <h1 id="title" class="sr-only">mino</h1>
    </div>
    <div class="search-wrap">
      <button
        type="button"
        id="command-center"
        title="mino"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="quick-open"
      >
        <span data-icon="search" data-icon-size="14" aria-hidden="true"></span>
        <span class="command-center-label">mino</span>
      </button>
    </div>
  </header>

  <div id="quick-open-backdrop" hidden aria-hidden="true"></div>

  <div id="quick-open" role="dialog" aria-label="Quick Open" hidden>
    <label class="quick-open-input-wrap" for="quick-open-input">
      <span data-icon="search" data-icon-size="14" aria-hidden="true"></span>
      <input
        id="quick-open-input"
        type="search"
        placeholder="Search files by name"
        autocomplete="off"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="quick-open-list"
      >
    </label>
    <ul id="quick-open-list" role="listbox"></ul>
  </div>

  <div id="watch-banner" class="banner" hidden>
    Live reload unavailable — refresh manually
  </div>

  <main class="workbench">
    <nav class="activity-bar" aria-label="Activity">
      <button
        type="button"
        id="activity-files"
        class="activity-item active"
        aria-label="Explorer"
        aria-controls="sidebar"
        aria-expanded="true"
        title="Explorer"
      >
        <span data-icon="explorer" data-icon-size="24" aria-hidden="true"></span>
      </button>
    </nav>

    <aside id="sidebar" class="sidebar" aria-label="Explorer">
      <div class="sidebar-header">
        <span class="sidebar-title">Explorer</span>
        <button
          type="button"
          id="sidebar-collapse"
          class="icon-button"
          aria-label="Collapse explorer"
          title="Collapse explorer"
        >
          <span data-icon="collapse" data-icon-size="16" aria-hidden="true"></span>
        </button>
      </div>
      <nav id="tree" class="tree">
        <p class="muted">Loading files…</p>
      </nav>
    </aside>

    <section class="preview-pane">
      <div class="breadcrumb-bar" aria-live="polite">
        <div id="breadcrumb" class="breadcrumb">No file selected</div>
      </div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" data-icon="empty" data-icon-size="34" aria-hidden="true"></div>
        <strong>No preview selected</strong>
        <span>Choose an HTML or Markdown file from the sidebar.</span>
      </div>
      <iframe id="preview" title="Application preview" hidden></iframe>
    </section>
  </main>

  <footer class="status-bar">
    <div class="status-bar-left"></div>
    <div class="status-bar-right">
      <div id="md-width-wrap" hidden>
        <button
          type="button"
          id="md-width-button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="md-width-menu"
        >较宽</button>
        <ul id="md-width-menu" role="menu" hidden>
          <li role="none">
            <button type="button" role="menuitem" data-md-width="standard">标宽</button>
          </li>
          <li role="none">
            <button type="button" role="menuitem" data-md-width="wide">较宽</button>
          </li>
          <li role="none">
            <button type="button" role="menuitem" data-md-width="full">全宽</button>
          </li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="/fuzzy.js" defer></script>
  <script src="/md/preview-width.js" defer></script>
  <script src="/open-path.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
