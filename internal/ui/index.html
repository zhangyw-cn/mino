<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mino</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <h1 id="title">mino</h1>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <span class="sr-only">Search files</span>
        <input
          id="search"
          type="search"
          placeholder="Search files…"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="quick-open"
        >
      </div>
      <ul id="quick-open" role="listbox" hidden></ul>
    </div>
  </header>

  <div id="watch-banner" class="banner" hidden>
    Live reload unavailable — refresh manually
  </div>

  <main class="workbench">
    <nav class="activity-bar" aria-label="Activity">
      <button
        type="button"
        id="activity-files"
        class="activity-item active"
        aria-label="Explorer"
        aria-controls="sidebar"
        aria-expanded="true"
        title="Explorer"
      >
        <span aria-hidden="true">☰</span>
      </button>
    </nav>

    <aside id="sidebar" class="sidebar" aria-label="Explorer">
      <div class="sidebar-header">
        <span class="sidebar-title">Explorer</span>
        <button
          type="button"
          id="sidebar-collapse"
          class="icon-button"
          aria-label="Collapse explorer"
          title="Collapse explorer"
        >
          <span aria-hidden="true">⟨</span>
        </button>
      </div>
      <nav id="tree" class="tree">
        <p class="muted">Loading files…</p>
      </nav>
    </aside>

    <section class="preview-pane">
      <div class="breadcrumb-bar" aria-live="polite">
        <div id="breadcrumb" class="breadcrumb">No file selected</div>
      </div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">◇</div>
        <strong>No preview selected</strong>
        <span>Choose an HTML file from the sidebar.</span>
      </div>
      <iframe id="preview" title="Application preview" hidden></iframe>
    </section>
  </main>

  <script src="/fuzzy.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
